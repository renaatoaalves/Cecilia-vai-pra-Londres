    inset:0;

.hero-content{

function badge(status){

if(status === "vendido"){
return '<span class="badge vendido">Vendido</span>';
}

if(status === "reservado"){
return '<span class="badge reservado">Reservado</span>';
}

return '<span class="badge disponivel">Disponível</span>';

}

function renderizar(){

<div class="miniaturas">

src="img/${f}"
