function badge(status){

if(status === "vendido"){
return '<span class="badge vendido">Vendido</span>';
}

if(status === "reservado"){
return '<span class="badge reservado">Reservado</span>';
}

return '<span class="badge disponivel">Disponível</span>';

}

function renderizar(){

const busca =
document.getElementById("busca")
.value
.toLowerCase();

const html =
produtos
  .filter(p =>
    !p.oculto &&
    p.nome.toLowerCase().includes(busca)
  )
  .sort((a, b) => {
    if (a.status === "vendido" && b.status !== "vendido") return 1;
    if (a.status !== "vendido" && b.status === "vendido") return -1;
    return 0;
  })
  .map(p =>
`
<div class="card">

<div class="galeria">

<img
id="foto-${p.nome.replace(/\s+/g,'')}"
src="img/${p.fotos ? p.fotos[0] : p.foto}"
>

${p.fotos ? `
<div class="miniaturas">
